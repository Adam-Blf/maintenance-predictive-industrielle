name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check tag matches the version source
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ -f package.json ]; then V=$(jq -r .version package.json)
          elif [ -f pyproject.toml ]; then V=$(grep -m1 -E '^version *=' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')
          else V=$(tr -d '[:space:]' < VERSION); fi
          [ "$V" = "$TAG" ] || { echo "tag $TAG != version $V"; exit 1; }
      - name: Extract release notes from CHANGELOG
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          git archive --format=zip -o "${GITHUB_REPOSITORY#*/}-${GITHUB_REF_NAME}.zip" HEAD
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md *.zip
